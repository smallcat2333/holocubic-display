name: Windows CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Python
        run: |
          python -m unittest -v test_holo_usb_display.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s rs_holocubic -p "test_*.py"
      - name: Test Rust
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Package runtime
        run: ./scripts/package.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: holocubic-display-windows-x64
          path: dist/holocubic-display/
          if-no-files-found: error
          retention-days: 14

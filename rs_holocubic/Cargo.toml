[package]
name = "rs_holocubic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "USB desktop controller for HoloCubic displays, with local scenes and calendar support."
repository = "https://github.com/smallcat2333/holocubic-display"
readme = "README.md"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
egui-phosphor = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
crc32fast = "1.4"
base64 = "0.22"
ab_glyph = "0.2.32"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json", "gzip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
html-escape = "0.2"
chrono = "0.4"

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winres = "0.1.12"
